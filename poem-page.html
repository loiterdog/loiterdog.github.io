<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poem Page</title>
    <meta
      name="description"
      content="Example translation page in a sepia-toned early-web literary archive style."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell poem-page-shell">
      <main class="content poem-content">
        <article class="panel poem-panel">
          <p class="kicker">Poem / translation / commentary</p>
          <h1>Example poem</h1>

          <div class="poem-block">
            <div class="poem-column original">
              <h2>Russian</h2>
              <p>И всё же в тишине<br />
              звенит не гул, а память —<br />
              как поздний звон в стекле.</p>
            </div>

            <div class="poem-column translation">
              <h2>English</h2>
              <p>And yet in the silence<br />
              it is not a drone but memory that rings —<br />
              like the late bell in glass.</p>
            </div>
          </div>

          <div class="notes">
            <h2>Notes</h2>
            <p>Paragraph 1</p>
            <p>Paragraph 2</p>
          </div>
        </article>
      </main>
    </div>
  </body>
</html>
